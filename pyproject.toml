[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cipher-bruteforce"
version = "0.1.0"
description = "Heuristic brute-force cryptanalysis CLI for classical ciphers and encodings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cipher-bruteforce = "cipher_bruteforce.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
